name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y pandoc libreoffice-writer poppler-utils fonts-liberation fonts-dejavu
      - run: pip install -r requirements.txt
      - run: python3 scripts/make.py
      - run: python3 scripts/build_public.py
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
