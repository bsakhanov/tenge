name: public-html-test
on:
  push:
    branches: [main]
    paths: ["report/public/**", "scripts/build_public.py", "scripts/test_public_html.py", "registry/facts.csv"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y pandoc fonts-dejavu
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python3 scripts/build_public.py --html-only
      - run: python3 scripts/test_public_html.py
